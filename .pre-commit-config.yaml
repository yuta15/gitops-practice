minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format check
        entry: uv run --no-sync ruff format --check
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run --no-sync pyright
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest
        language: system
        pass_filenames: false

