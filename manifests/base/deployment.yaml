apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: test-app
  labels:
    app: test-app
  name: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - image: ghcr.io/yuta15/gitops-practice:cb02cd99b90315469a7574c60c46732ecaf02d41
          name: test-app
