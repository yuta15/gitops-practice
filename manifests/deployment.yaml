apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: test-app
  labels:
    app: test-app
  name: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - image: ghcr.io/yuta15/gitops-practice:3f8e0eccf7c3d83d7b06e70806eff3c419b832b1
        name: test-app
